name: AI 日报

on:
  schedule:
    # 目标：北京时间 10:00 左右收到。
    # GitHub 自 2026-08 起把 schedule 延迟约 6.7–8.3 小时才创建 run（社区 issue #209507/#210361/#212830），
    # 所以这里故意提前：19:00 UTC = 北京 03:00，延迟 ~7.5 小时后约在北京 10:30 触发。
    # GitHub 修好这个 bug 之后，改回 '0 2 * * *'。
    - cron: '0 19 * * *'
  workflow_dispatch: {} # 支持在 Actions 页面手动点一次，用来测试

permissions:
  contents: write # 需要提交 seen.json，避免重复推送

concurrency:
  group: ai-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: 抓取并发送
        run: node digest.mjs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          # 可选。没有配置这个 secret 时会自动回退到按时间挑选
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: 提交已推送记录
        run: |
          git config user.name "ai-digest-bot"
          git config user.email "ai-digest-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (
            git commit -m "chore: update seen list" &&
            git push
          )
